<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>StayWithMe</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #140f0d;
      }
    </style>
  </head>
  <body>
    <div id="intro"></div>

    <!-- Copy of public/intro.js — see scripts/sync-native-assets.mjs. -->
    <script src="intro.js"></script>
    <script>
      // The native shell removes this overlay once the site has loaded, so the
      // loading bar keeps cycling instead of self-dismissing.
      window.StayWithMeIntro.mount(document.getElementById("intro"), { loop: true });
    </script>
  </body>
</html>
