<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>StayWithMe — No connection</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fdf8f4;
        color: #2a1c14;
      }
      .card { max-width: 360px; text-align: center; }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 20px;
        border-radius: 20px;
        background: linear-gradient(135deg, #e8a020 0%, #c8705e 100%);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 32px; font-weight: 700;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; color: #6b574b; }
      button {
        appearance: none; border: 0; cursor: pointer;
        padding: 12px 28px; border-radius: 999px;
        background: #c8705e; color: #fff;
        font-size: 15px; font-weight: 600;
      }
      button:active { background: #a84d3a; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">S</div>
      <h1>You're offline</h1>
      <p>StayWithMe needs an internet connection. Check your network and try again.</p>
      <button type="button" onclick="location.replace('https://staywithme.co.in')">Retry</button>
    </div>
  </body>
</html>
