name: iOS App

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "native/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# Needed to publish the build as a release asset.
permissions:
  contents: write

concurrency:
  group: ios-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      # Signed builds only kick in once these repo secrets are configured.
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      IOS_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The shell loads the live site, so no Next.js build is required — skip
      # postinstall scripts to keep this fast and free of DB env vars.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Regenerates capacitor-cordova-ios-plugins + copies native/www assets.
      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > \
            ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Build app
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            SIGNING_ARGS=(DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual)
          else
            # Unsigned builds still produce an .ipa that sideloaders can re-sign.
            SIGNING_ARGS=(
              CODE_SIGNING_ALLOWED=NO
              CODE_SIGNING_REQUIRED=NO
              CODE_SIGN_IDENTITY=""
              CODE_SIGN_ENTITLEMENTS=""
            )
          fi

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$IOS_VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            "${SIGNING_ARGS[@]}" \
            clean build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # Build logs need an authenticated API call to read, so mirror them to a
      # public prerelease asset instead. Safe to delete once the build is green.
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 200000 "$RUNNER_TEMP/xcodebuild.log" > xcodebuild-tail.log || echo "no build log" > xcodebuild-tail.log
          gh release view ci-debug-ios >/dev/null 2>&1 || \
            gh release create ci-debug-ios --title "iOS CI debug logs" --notes "Transient build logs." --prerelease --latest=false
          gh release upload ci-debug-ios xcodebuild-tail.log --clobber

      - name: Package IPA
        id: ipa
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle was produced"
            exit 1
          fi

          # An .ipa is just a zip with the bundle under Payload/.
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          mkdir -p dist
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/dist/StayWithMe.ipa" Payload)

          echo "path=dist/StayWithMe.ipa" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: StayWithMe-ipa
          path: ${{ steps.ipa.outputs.path }}

      # Rolling "ios-latest" release so the download URL never changes.
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-latest >/dev/null 2>&1 || \
            gh release create ios-latest \
              --title "StayWithMe for iOS" \
              --notes "Building..." \
              --latest=false

          gh release upload ios-latest "${{ steps.ipa.outputs.path }}" --clobber

          if [ "$HAS_SIGNING" = "true" ]; then
            INSTALL_NOTE="Signed build — install with Apple Configurator, Xcode, or distribute via TestFlight."
          else
            INSTALL_NOTE="Unsigned build — iPhones will not install it directly. Re-sign it with [Sideloadly](https://sideloadly.io) or AltStore using your Apple ID (free accounts expire after 7 days), or open the project in Xcode on a Mac."
          fi

          gh release edit ios-latest --notes "$(printf '%s\n' \
            "**Version ${IOS_VERSION_NAME}** (build ${IOS_BUILD_NUMBER})" \
            "" \
            "$INSTALL_NOTE" \
            "" \
            "The app loads https://staywithme.co.in, so an internet connection is required.")"

          # A green build means any previously published failure log is stale.
          gh release delete ci-debug-ios --yes --cleanup-tag 2>/dev/null || true

          {
            echo "### iOS build ready :apple:"
            echo ""
            echo "Version \`${IOS_VERSION_NAME}\` (build \`${IOS_BUILD_NUMBER}\`)"
            echo ""
            echo "$INSTALL_NOTE"
            echo ""
            echo "**Download:** https://github.com/${{ github.repository }}/releases/download/ios-latest/StayWithMe.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
