name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "native/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# Needed to publish the APK as a release asset.
permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release signing only kicks in once these repo secrets are configured.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The Android shell loads the live site, so no Next.js build is required —
      # skip postinstall scripts to keep this fast and free of DB env vars.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Regenerates capacitor-cordova-android-plugins + copies native/www assets.
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          ./gradlew "$TASK" --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # Build logs need an authenticated API call to read, so mirror them to a
      # public prerelease asset instead. Safe to delete once the build is green.
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 200000 "$RUNNER_TEMP/gradle.log" > gradle-tail.log || echo "no gradle log" > gradle-tail.log
          gh release view ci-debug >/dev/null 2>&1 || \
            gh release create ci-debug --title "CI debug logs" --notes "Transient build logs." --prerelease --latest=false
          gh release upload ci-debug gradle-tail.log --clobber

      - name: Collect APK
        id: apk
        run: |
          src=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$src" ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          mkdir -p dist
          # Stable filename keeps the release download URL permanent.
          cp "$src" dist/StayWithMe.apk
          echo "path=dist/StayWithMe.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: StayWithMe-apk
          path: ${{ steps.apk.outputs.path }}

      # Rolling "android-latest" release so the download URL never changes.
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest \
              --title "StayWithMe for Android" \
              --notes "Building..." \
              --latest=false

          gh release upload android-latest "${{ steps.apk.outputs.path }}" --clobber

          # Drop APKs left by older runs that used version-stamped filenames.
          gh release view android-latest --json assets --jq '.assets[].name' \
            | grep -E '\.apk$' | grep -v '^StayWithMe\.apk$' \
            | while read -r stale; do gh release delete-asset android-latest "$stale" --yes || true; done

          gh release edit android-latest --notes "$(printf '%s\n' \
            "**Version ${ANDROID_VERSION_NAME}** (build ${ANDROID_VERSION_CODE})" \
            "" \
            "Download **StayWithMe.apk** below and open it on your Android phone to install." \
            "You may need to allow \"Install unknown apps\" for your browser." \
            "" \
            "The app loads https://staywithme.co.in, so an internet connection is required.")"

          # A green build means any previously published failure log is stale.
          gh release delete ci-debug --yes --cleanup-tag 2>/dev/null || true

          {
            echo "### APK ready :rocket:"
            echo ""
            echo "Version \`${ANDROID_VERSION_NAME}\` (code \`${ANDROID_VERSION_CODE}\`)"
            echo ""
            if [ "$HAS_KEYSTORE" != "true" ]; then
              echo "> Debug-signed build. Each run uses a fresh debug key, so uninstall the previous app before installing a new APK."
            fi
            echo ""
            echo "**Download:** https://github.com/${{ github.repository }}/releases/download/android-latest/StayWithMe.apk"
          } >> "$GITHUB_STEP_SUMMARY"
